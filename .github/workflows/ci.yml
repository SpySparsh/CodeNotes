name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Run Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Vitest 5 has a peer requirement for newer @types/node while this project intentionally uses @types/node 20, so the flag is currently required for dependency installation.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run automated tests
        run: npm test

      - name: Run linter
        run: npm run lint

      - name: Run typecheck
        run: npx tsc --noEmit

      - name: Run build
        run: npm run build
